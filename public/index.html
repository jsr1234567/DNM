<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Register your phone to join DNM through iMessage."
    />
    <title>Join DNM on iMessage</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <section class="card" aria-labelledby="page-title">
        <div id="form-view">
          <a class="wordmark" href="/" aria-label="DNM home">
            <span class="wordmark-mark" aria-hidden="true">D</span>
            <span>DNM</span>
          </a>
          <h1 id="page-title">Connect to DNM</h1>
          <p class="form-intro">Enter your iMessage details.</p>

          <div id="form-error" class="notice notice-error" role="alert" tabindex="-1" hidden>
            <strong>Couldn’t connect.</strong>
            <span id="form-error-message">Check your details and try again.</span>
          </div>

          <form id="registration-form" novalidate>
            <div class="name-grid">
              <div class="field">
                <label for="first-name">First name</label>
                <input
                  id="first-name"
                  name="firstName"
                  type="text"
                  autocomplete="given-name"
                  maxlength="60"
                  placeholder="Alex"
                  required
                />
                <p class="field-error" id="first-name-error"></p>
              </div>

              <div class="field">
                <label for="last-name">Last name</label>
                <input
                  id="last-name"
                  name="lastName"
                  type="text"
                  autocomplete="family-name"
                  maxlength="60"
                  placeholder="Morgan"
                  required
                />
                <p class="field-error" id="last-name-error"></p>
              </div>
            </div>

            <div class="field">
              <label for="email">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                spellcheck="false"
                maxlength="254"
                placeholder="you@example.com"
                required
              />
              <p class="field-error" id="email-error"></p>
            </div>

            <div class="field">
              <label for="phone">iMessage number</label>
              <input
                id="phone"
                name="phone"
                type="tel"
                inputmode="tel"
                autocomplete="tel"
                spellcheck="false"
                placeholder="+14155551234"
                aria-describedby="phone-hint phone-error"
                required
              />
              <p class="hint" id="phone-hint">Use your country code, e.g. +14155551234.</p>
              <p class="field-error" id="phone-error"></p>
            </div>

            <div class="consent-field">
              <input id="consent" name="consent" type="checkbox" required />
              <label for="consent">
                I agree to receive DNM iMessages through Photon.
              </label>
            </div>
            <p class="field-error" id="consent-error"></p>

            <button class="primary-button" id="submit-button" type="submit">
              <span class="button-label">Connect</span>
              <span class="button-loader" aria-hidden="true"></span>
            </button>
          </form>
        </div>

        <div id="success-view" class="success-view" role="status" hidden>
          <div class="success-mark" aria-hidden="true">✓</div>
          <h2>Connected</h2>
          <p>Text <strong>Hello</strong> to:</p>
          <a id="message-link" class="phone-number" href="#"></a>
          <a id="open-messages" class="primary-button link-button" href="#">
            Open Messages
          </a>
          <button id="register-another" class="secondary-button" type="button">
            Add another
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
